<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Кликер</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
        user-select: none;
    }

    body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: linear-gradient(180deg, #1a1a2e 0%, #16213e 100%);
        color: white;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        overflow: hidden;
    }

    .balance {
        font-size: 48px;
        font-weight: bold;
        margin-bottom: 8px;
        text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
    }

    .balance-label {
        font-size: 14px;
        opacity: 0.6;
        margin-bottom: 40px;
        text-transform: uppercase;
        letter-spacing: 2px;
    }

    .coin {
        width: 220px;
        height: 220px;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 35%, #ffd700, #b8860b);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 90px;
        cursor: pointer;
        box-shadow: 0 10px 30px rgba(255, 215, 0, 0.4), inset 0 -8px 15px rgba(0,0,0,0.2);
        transition: transform 0.08s ease;
        border: 4px solid #fff8dc;
    }

    .coin:active {
        transform: scale(0.92);
    }

    .float-text {
        position: fixed;
        font-size: 28px;
        font-weight: bold;
        color: #ffd700;
        pointer-events: none;
        animation: floatUp 0.8s ease-out forwards;
        text-shadow: 0 0 8px rgba(0,0,0,0.5);
    }

    @keyframes floatUp {
        0% { transform: translateY(0); opacity: 1; }
        100% { transform: translateY(-80px); opacity: 0; }
    }

    .status {
        margin-top: 30px;
        font-size: 13px;
        opacity: 0.5;
    }
</style>
</head>
<body>

<div class="balance-label">Твой баланс</div>
<div class="balance" id="balance">0</div>

<div class="coin" id="coin">🪙</div>

<div class="status" id="status">Загрузка...</div>

<script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
        tg.ready();
        tg.expand();
    }

    const userId = tg?.initDataUnsafe?.user?.id || 12345;

    const API_URL = window.location.origin;

    const balanceEl = document.getElementById('balance');
    const coinEl = document.getElementById('coin');
    const statusEl = document.getElementById('status');

    let localBalance = 0;
    let pendingClicks = 0;
    let sendTimeout = null;

    async function loadBalance() {
        try {
            const res = await fetch(`${API_URL}/api/balance/${userId}`);
            const data = await res.json();
            localBalance = data.balance;
            balanceEl.textContent = localBalance;
            statusEl.textContent = `ID: ${userId}`;
        } catch (e) {
            statusEl.textContent = 'Ошибка загрузки. Проверь подключение к серверу.';
        }
    }

    function scheduleSend() {
        clearTimeout(sendTimeout);
        sendTimeout = setTimeout(async () => {
            const amount = pendingClicks;
            pendingClicks = 0;
            if (amount === 0) return;
            try {
                await fetch(`${API_URL}/api/click`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: userId, amount })
                });
            } catch (e) {
                statusEl.textContent = 'Ошибка синхронизации';
            }
        }, 500);
    }

    function showFloatText(x, y) {
        const el = document.createElement('div');
        el.className = 'float-text';
        el.textContent = '+1';
        el.style.left = x + 'px';
        el.style.top = y + 'px';
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 800);
    }

    coinEl.addEventListener('click', (e) => {
        localBalance += 1;
        pendingClicks += 1;
        balanceEl.textContent = localBalance;
        showFloatText(e.clientX - 15, e.clientY - 20);
        scheduleSend();
        tg?.HapticFeedback?.impactOccurred('light');
    });

    loadBalance();
</script>

</body>
</html>
