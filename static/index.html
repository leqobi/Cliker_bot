<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Sundered Star</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
}

html,
body {
    width: 100%;
    min-height: 100%;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background:
        radial-gradient(circle at 50% 20%, rgba(120, 70, 220, 0.15), transparent 35%),
        linear-gradient(180deg, #070711 0%, #111126 100%);
    color: white;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 14px 16px 24px;
    overflow-x: hidden;
}

/* Верх */

.object-name {
    margin-top: 4px;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 1px;
    opacity: 0.95;
}

.balance-label {
    margin-top: 8px;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 2px;
    opacity: 0.45;
}

.balance {
    margin-top: 1px;
    font-size: 42px;
    line-height: 1.1;
    font-weight: 800;
    text-shadow: 0 0 25px rgba(255, 180, 80, 0.35);
}

/* Космический объект */

.object-wrap {
    position: relative;
    width: 230px;
    height: 230px;
    margin: 10px 0 8px;
    cursor: pointer;
    touch-action: manipulation;
}

.object-glow {
    position: absolute;
    left: -25px;
    top: -25px;
    width: 280px;
    height: 280px;
    border-radius: 50%;
    background:
        radial-gradient(
            circle,
            rgba(170, 100, 255, 0.30) 0%,
            rgba(120, 70, 220, 0.12) 35%,
            transparent 70%
        );
    pointer-events: none;
    transition: filter 0.3s ease;
}

.object-img {
    position: absolute;
    inset: 0;
    width: 230px;
    height: 230px;
    object-fit: contain;
    pointer-events: none;
    -webkit-user-drag: none;
    transition:
        transform 0.07s ease,
        filter 0.35s ease;
}

.cracks-overlay {
    position: absolute;
    inset: 0;
    width: 230px;
    height: 230px;
    object-fit: contain;
    pointer-events: none;
    transition: opacity 0.5s ease;
}

.object-wrap:active .object-img {
    transform: scale(0.91);
}

/* Всплывающие монеты */

.float-text {
    position: fixed;
    font-size: 21px;
    font-weight: 800;
    color: #ffb347;
    pointer-events: none;
    z-index: 100;
    text-shadow: 0 0 10px rgba(0, 0, 0, 0.8);
    animation: floatUp 0.75s ease-out forwards;
}

@keyframes floatUp {
    0% {
        transform: translateY(0) scale(1);
        opacity: 1;
    }

    100% {
        transform: translateY(-70px) scale(1.08);
        opacity: 0;
    }
}

/* Прогресс */

.progress-block,
.stamina-block,
.daily-card,
.prestige-btn,
.upgrades {
    width: 100%;
    max-width: 340px;
}

.progress-block {
    margin-top: 2px;
}

.progress-label,
.stamina-label {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 11px;
    opacity: 0.7;
    margin-bottom: 5px;
}

.progress-bar-bg,
.stamina-bar-bg {
    width: 100%;
    height: 9px;
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.08);
    overflow: hidden;
}

.progress-bar-fill {
    height: 100%;
    width: 0%;
    border-radius: 10px;
    background: linear-gradient(90deg, #8b5cf6, #d946ef);
    transition: width 0.25s ease;
}

.stamina-block {
    margin-top: 10px;
}

.stamina-bar-fill {
    height: 100%;
    width: 0%;
    border-radius: 10px;
    background: linear-gradient(90deg, #3182ce, #63b3ed);
    transition: width 0.2s ease;
}

/* Daily */

.daily-card {
    margin-top: 13px;
    margin-bottom: 10px;
    padding: 13px 15px;

    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;

    background: linear-gradient(
        135deg,
        rgba(255, 180, 50, 0.14),
        rgba(255, 100, 50, 0.07)
    );

    border: 1px solid rgba(255, 180, 50, 0.25);
    border-radius: 15px;
}

.daily-info {
    text-align: left;
}

.daily-title {
    font-size: 13px;
    font-weight: 700;
}

.daily-sub {
    margin-top: 3px;
    font-size: 10px;
    opacity: 0.65;
}

.daily-btn,
.upgrade-btn {
    border: none;
    border-radius: 10px;
    padding: 9px 14px;
    background: linear-gradient(135deg, #ffb347, #ff8c00);
    color: #171717;
    font-weight: 800;
    font-size: 12px;
    white-space: nowrap;
}

.daily-btn:disabled,
.upgrade-btn:disabled {
    background: rgba(255, 255, 255, 0.08);
    color: rgba(255, 255, 255, 0.32);
}

/* Prestige */

.prestige-btn {
    margin-bottom: 10px;
    padding: 14px;

    border: none;
    border-radius: 15px;

    background: linear-gradient(135deg, #9333ea, #d946ef);

    color: white;
    font-size: 14px;
    font-weight: 800;

    box-shadow: 0 5px 22px rgba(168, 85, 247, 0.3);
}

.prestige-btn:disabled {
    background: rgba(255, 255, 255, 0.07);
    color: rgba(255, 255, 255, 0.3);
    box-shadow: none;
}

/* Улучшения */

.upgrades {
    display: flex;
    flex-direction: column;
    gap: 9px;
}

.upgrade-card {
    width: 100%;
    padding: 12px 14px;

    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;

    background: rgba(255, 255, 255, 0.055);
    border: 1px solid rgba(255, 255, 255, 0.09);
    border-radius: 15px;
}

.upgrade-info {
    text-align: left;
}

.upgrade-title {
    font-size: 13px;
    font-weight: 700;
}

.upgrade-sub {
    margin-top: 3px;
    font-size: 10px;
    opacity: 0.58;
}

/* Статус */

.status {
    margin-top: 12px;
    font-size: 10px;
    opacity: 0.3;
    text-align: center;
}

/* Маленькие экраны */

@media (max-height: 700px) {
    body {
        padding-top: 8px;
    }

    .object-wrap {
        width: 190px;
        height: 190px;
        margin: 5px 0;
    }

    .object-img,
    .cracks-overlay {
        width: 190px;
        height: 190px;
    }

    .object-glow {
        width: 235px;
        height: 235px;
        left: -22px;
        top: -22px;
    }

    .balance {
        font-size: 36px;
    }
}
</style>
</head>

<body>

<div class="object-name" id="object-name">
    Загрузка...
</div>

<div class="balance-label">
    Твой баланс
</div>

<div class="balance" id="balance">
    0
</div>

<div class="object-wrap" id="object-wrap">

    <div class="object-glow" id="object-glow"></div>

    <img
        class="object-img"
        id="object-img"
        src=""
        alt="Космический объект"
    >

    <img
        class="cracks-overlay"
        id="cracks-overlay"
        src="/images/cracks.png"
        alt=""
    >

</div>

<div class="progress-block">

    <div class="progress-label">
        <span>🌌 Прогресс</span>
        <span id="progress-text">0/0</span>
    </div>

    <div class="progress-bar-bg">
        <div
            class="progress-bar-fill"
            id="progress-fill"
        ></div>
    </div>

</div>

<div class="stamina-block">

    <div class="stamina-label">
        <span>⚡ Стамина</span>
        <span id="stamina-text">0/0</span>
    </div>

    <div class="stamina-bar-bg">
        <div
            class="stamina-bar-fill"
            id="stamina-fill"
        ></div>
    </div>

</div>

<div class="daily-card">

    <div class="daily-info">

        <div class="daily-title">
            🎁 Ежедневный бонус
        </div>

        <div
            class="daily-sub"
            id="daily-sub"
        >
            Загрузка...
        </div>

    </div>

    <button
        class="daily-btn"
        id="daily-btn"
    >
        ...
    </button>

</div>

<button
    class="prestige-btn"
    id="prestige-btn"
    disabled
>
    Набери прогресс для перелёта
</button>

<div class="upgrades">

    <div class="upgrade-card">

        <div class="upgrade-info">

            <div class="upgrade-title">
                👆 Сила клика
            </div>

            <div
                class="upgrade-sub"
                id="click-level-text"
            >
                Уровень 1 · +1 монета
            </div>

        </div>

        <button
            class="upgrade-btn"
            id="upgrade-click-btn"
        >
            ...
        </button>

    </div>

    <div class="upgrade-card">

        <div class="upgrade-info">

            <div class="upgrade-title">
                ⚡ Запас стамины
            </div>

            <div
                class="upgrade-sub"
                id="stamina-level-text"
            >
                Уровень 1
            </div>

        </div>

        <button
            class="upgrade-btn"
            id="upgrade-stamina-btn"
        >
            ...
        </button>

    </div>

</div>

<div
    class="status"
    id="status"
>
    Загрузка...
</div>


<script>

const tg = window.Telegram?.WebApp;

if (tg) {
    tg.ready();
    tg.expand();
}

const userId =
    tg?.initDataUnsafe?.user?.id ||
    12345;

const API_URL =
    window.location.origin;


/* DOM */

const objectNameEl =
    document.getElementById("object-name");

const balanceEl =
    document.getElementById("balance");

const objectWrapEl =
    document.getElementById("object-wrap");

const objectImgEl =
    document.getElementById("object-img");

const objectGlowEl =
    document.getElementById("object-glow");

const cracksOverlayEl =
    document.getElementById("cracks-overlay");

const progressTextEl =
    document.getElementById("progress-text");

const progressFillEl =
    document.getElementById("progress-fill");

const staminaTextEl =
    document.getElementById("stamina-text");

const staminaFillEl =
    document.getElementById("stamina-fill");

const clickLevelTextEl =
    document.getElementById("click-level-text");

const staminaLevelTextEl =
    document.getElementById("stamina-level-text");

const upgradeClickBtn =
    document.getElementById("upgrade-click-btn");

const upgradeStaminaBtn =
    document.getElementById("upgrade-stamina-btn");

const prestigeBtn =
    document.getElementById("prestige-btn");

const dailySubEl =
    document.getElementById("daily-sub");

const dailyBtn =
    document.getElementById("daily-btn");

const statusEl =
    document.getElementById("status");


/* Состояние */

let state = null;

let objectsList = [];

let pendingTaps = 0;

let sendTimeout = null;

let localStamina = 0;

let currentObjectIndex = -1;


/* =========================
   OBJECTS
========================= */

async function loadObjectsList() {

    const response =
        await fetch(`${API_URL}/api/objects`);

    if (!response.ok) {
        throw new Error("Не удалось загрузить объекты");
    }

    objectsList =
        await response.json();
}


/* =========================
   VISUAL
========================= */

function updateObjectVisual() {

    if (!state) return;

    const index =
        state.object_index;

    const obj =
        objectsList[index];

    if (!obj) return;

    if (currentObjectIndex !== index) {

        currentObjectIndex = index;

        /*
         * ВАЖНО:
         * твои изображения находятся
         * в static/images/
         */

        objectImgEl.src =
            `/images/${obj.image}`;

        /*
         * Трещины нужны только планетам
         */

        if (state.object_category === "planet") {

            cracksOverlayEl.style.display =
                "block";

        } else {

            cracksOverlayEl.style.display =
                "none";

        }
    }


    let progressPct = 0;

    if (state.object_threshold) {

        progressPct =
            Math.min(
                100,
                (
                    state.object_progress /
                    state.object_threshold
                ) * 100
            );

    } else {

        progressPct = 100;

    }


    /*
     * Трещины постепенно исчезают
     */

    if (state.object_category === "planet") {

        cracksOverlayEl.style.opacity =
            1 - (progressPct / 100) * 0.9;

    }


    /*
     * Звёзды и чёрные дыры
     * становятся ярче
     */

    if (
        state.object_category === "star" ||
        state.object_category === "blackhole"
    ) {

        const brightness =
            0.55 + (progressPct / 100) * 0.85;

        objectImgEl.style.filter =
            `brightness(${brightness})`;

        objectGlowEl.style.filter =
            `brightness(${brightness})`;

    } else {

        objectImgEl.style.filter =
            "none";

        objectGlowEl.style.filter =
            "none";
    }
}


/* =========================
   RENDER
========================= */

function renderState() {

    if (!state) return;


    objectNameEl.textContent =
        state.object_name;


    balanceEl.textContent =
        state.balance.toLocaleString("ru-RU");


    /*
     * STAMINA
     */

    const staminaPct =
        Math.max(
            0,
            Math.min(
                100,
                (localStamina /
                    state.stamina_max) * 100
            )
        );

    staminaFillEl.style.width =
        `${staminaPct}%`;

    staminaTextEl.textContent =
        `${Math.floor(localStamina)}/${state.stamina_max}`;


    /*
     * PROGRESS
     */

    if (state.object_threshold) {

        const progressPct =
            Math.min(
                100,
                (
                    state.object_progress /
                    state.object_threshold
                ) * 100
            );

        progressFillEl.style.width =
            `${progressPct}%`;

        progressTextEl.textContent =
            `${state.object_progress}/${state.object_threshold}`;

    } else {

        progressFillEl.style.width =
            "100%";

        progressTextEl.textContent =
            "Финал";
    }


    /*
     * CLICK UPGRADE
     */

    clickLevelTextEl.textContent =
        `Уровень ${state.click_level} · +${state.click_power} монета`;


    if (state.click_upgrade_cost === -1) {

        upgradeClickBtn.textContent =
            "MAX";

        upgradeClickBtn.disabled =
            true;

    } else {

        upgradeClickBtn.textContent =
            state.click_upgrade_cost.toLocaleString("ru-RU");

        upgradeClickBtn.disabled =
            state.balance <
            state.click_upgrade_cost;
    }


    /*
     * STAMINA UPGRADE
     */

    staminaLevelTextEl.textContent =
        `Уровень ${state.stamina_level} · макс ${state.stamina_max}`;


    if (state.stamina_upgrade_cost === -1) {

        upgradeStaminaBtn.textContent =
            "MAX";

        upgradeStaminaBtn.disabled =
            true;

    } else {

        upgradeStaminaBtn.textContent =
            state.stamina_upgrade_cost.toLocaleString("ru-RU");

        upgradeStaminaBtn.disabled =
            state.balance <
            state.stamina_upgrade_cost;
    }


    /*
     * PRESTIGE
     */

    if (state.is_final_object) {

        prestigeBtn.textContent =
            "🌟 Это финальный объект!";

        prestigeBtn.disabled =
            true;

    } else if (state.can_prestige) {

        const percent =
            Math.round(
                state.prestige_multiplier * 100 - 100
            );

        prestigeBtn.textContent =
            `🚀 Лететь дальше (+${percent}% навсегда)`;

        prestigeBtn.disabled =
            false;

    } else {

        prestigeBtn.textContent =
            "Набери прогресс для перелёта";

        prestigeBtn.disabled =
            true;
    }


    /*
     * DAILY
     */

    const daily =
        state.daily_status;


    dailySubEl.textContent =
        `Стрик: ${state.daily_streak} дн. · +${state.daily_next_amount} монет`;


    if (daily.can_claim) {

        dailyBtn.textContent =
            "Забрать";

        dailyBtn.disabled =
            false;

    } else {

        dailyBtn.textContent =
            `${daily.hours_until_next}ч`;

        dailyBtn.disabled =
            true;
    }


    updateObjectVisual();
}


/* =========================
   LOAD STATE
========================= */

async function loadState() {

    try {

        const response =
            await fetch(
                `${API_URL}/api/state/${userId}`
            );

        if (!response.ok) {
            throw new Error();
        }

        state =
            await response.json();

        localStamina =
            state.stamina;

        statusEl.textContent =
            `ID: ${userId} · Перелётов: ${state.prestige_count}`;

        renderState();

    } catch (error) {

        console.error(error);

        statusEl.textContent =
            "Ошибка загрузки сервера";
    }
}


/* =========================
   LOCAL STAMINA REGEN
========================= */

setInterval(() => {

    if (!state) return;

    if (localStamina < state.stamina_max) {

        localStamina =
            Math.min(
                state.stamina_max,
                localStamina + 0.4
            );

        renderState();
    }

}, 200);


/* =========================
   SEND CLICKS
========================= */

function scheduleSend() {

    clearTimeout(sendTimeout);

    sendTimeout =
        setTimeout(async () => {

            const taps =
                pendingTaps;

            pendingTaps = 0;

            if (taps <= 0) return;


            try {

                const response =
                    await fetch(
                        `${API_URL}/api/click`,
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({
                                user_id: userId,
                                taps: taps
                            })
                        }
                    );


                if (!response.ok) {

                    /*
                     * Если сервер отклонил клики,
                     * обновляем состояние
                     */

                    await loadState();

                    return;
                }


                state =
                    await response.json();

                localStamina =
                    state.stamina;

                renderState();

            } catch (error) {

                console.error(error);

                statusEl.textContent =
                    "Ошибка синхронизации";
            }

        }, 350);
}


/* =========================
   FLOAT TEXT
========================= */

function showFloatText(
    x,
    y,
    amount
) {

    const el =
        document.createElement("div");

    el.className =
        "float-text";

    el.textContent =
        "+" + amount;

    el.style.left =
        `${x}px`;

    el.style.top =
        `${y}px`;

    document.body.appendChild(el);


    setTimeout(() => {

        el.remove();

    }, 800);
}


/* =========================
   CLICK
========================= */

objectWrapEl.addEventListener(
    "click",
    (event) => {

        if (!state) return;

        if (localStamina < 1) return;


        localStamina -= 1;

        pendingTaps += 1;


        const prestigeMult =
            state.prestige_multiplier || 1;


        const earnedThisClick =
            Math.round(
                state.click_power *
                prestigeMult
            );


        /*
         * Показываем баланс
         * с учётом ещё не отправленных кликов
         */

        const predictedBalance =
            state.balance +
            (
                pendingTaps *
                state.click_power *
                prestigeMult
            );


        balanceEl.textContent =
            Math.round(
                predictedBalance
            ).toLocaleString("ru-RU");


        showFloatText(
            event.clientX - 10,
            event.clientY - 20,
            earnedThisClick
        );


        renderState();

        scheduleSend();


        if (tg?.HapticFeedback) {

            tg.HapticFeedback
                .impactOccurred("light");
        }
    }
);


/* =========================
   CLICK UPGRADE
========================= */

upgradeClickBtn.addEventListener(
    "click",
    async () => {

        if (!state) return;

        try {

            const response =
                await fetch(
                    `${API_URL}/api/upgrade/click`,
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            user_id: userId
                        })
                    }
                );


            if (!response.ok) {

                const error =
                    await response.json();

                alert(
                    error.detail ||
                    "Не удалось улучшить"
                );

                return;
            }


            state =
                await response.json();

            localStamina =
                state.stamina;

            renderState();


            if (tg?.HapticFeedback) {

                tg.HapticFeedback
                    .notificationOccurred(
                        "success"
                    );
            }

        } catch (error) {

            console.error(error);

            statusEl.textContent =
                "Ошибка покупки";
        }
    }
);


/* =========================
   STAMINA UPGRADE
========================= */

upgradeStaminaBtn.addEventListener(
    "click",
    async () => {

        if (!state) return;

        try {

            const response =
                await fetch(
                    `${API_URL}/api/upgrade/stamina`,
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            user_id: userId
                        })
                    }
                );


            if (!response.ok) {

                const error =
                    await response.json();

                alert(
                    error.detail ||
                    "Не удалось улучшить"
                );

                return;
            }


            state =
                await response.json();

            localStamina =
                state.stamina;

            renderState();


            if (tg?.HapticFeedback) {

                tg.HapticFeedback
                    .notificationOccurred(
                        "success"
                    );
            }

        } catch (error) {

            console.error(error);

            statusEl.textContent =
                "Ошибка покупки";
        }
    }
);


/* =========================
   PRESTIGE
========================= */

prestigeBtn.addEventListener(
    "click",
    async () => {

        if (!state) return;

        if (!state.can_prestige) return;


        try {

            const response =
                await fetch(
                    `${API_URL}/api/prestige`,
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            user_id: userId
                        })
                    }
                );


            if (!response.ok) {

                const error =
                    await response.json();

                alert(
                    error.detail ||
                    "Перелёт невозможен"
                );

                return;
            }


            state =
                await response.json();

            localStamina =
                state.stamina;


            statusEl.textContent =
                `ID: ${userId} · Перелётов: ${state.prestige_count}`;


            renderState();


            if (tg?.HapticFeedback) {

                tg.HapticFeedback
                    .notificationOccurred(
                        "success"
                    );
            }

        } catch (error) {

            console.error(error);

            statusEl.textContent =
                "Ошибка перелёта";
        }
    }
);


/* =========================
   DAILY
========================= */

dailyBtn.addEventListener(
    "click",
    async () => {

        if (!state) return;

        try {

            const response =
                await fetch(
                    `${API_URL}/api/daily/claim`,
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            user_id: userId
                        })
                    }
                );


            if (!response.ok) {

                const error =
                    await response.json();

                alert(
                    error.detail ||
                    "Бонус пока недоступен"
                );

                return;
            }


            state =
                await response.json();

            localStamina =
                state.stamina;

            renderState();


            if (tg?.HapticFeedback) {

                tg.HapticFeedback
                    .notificationOccurred(
                        "success"
                    );
            }

        } catch (error) {

            console.error(error);

            statusEl.textContent =
                "Ошибка получения бонуса";
        }
    }
);


/* =========================
   INIT
========================= */

async function init() {

    try {

        statusEl.textContent =
            "Загрузка...";

        await loadObjectsList();

        await loadState();

    } catch (error) {

        console.error(error);

        statusEl.textContent =
            "Ошибка запуска игры";
    }
}


init();

</script>
