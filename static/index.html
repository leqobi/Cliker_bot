<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Sundered Star</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
        user-select: none;
    }

    :root {
        --bg-main: #070812;
        --bg-second: #101225;
        --panel: rgba(20, 23, 45, 0.82);
        --panel-border: rgba(255,255,255,0.10);

        --purple: #9d6cff;
        --purple-light: #c08cff;

        --gold: #ffb347;
        --gold-light: #ffd27a;

        --blue: #4fa3ff;
        --blue-light: #78c2ff;

        --text: #ffffff;
        --muted: rgba(255,255,255,0.55);
    }

    html {
        min-height: 100%;
        background: var(--bg-main);
    }

    body {
        min-height: 100vh;
        padding: 12px 14px 24px;

        font-family:
            -apple-system,
            BlinkMacSystemFont,
            "Segoe UI",
            Roboto,
            Arial,
            sans-serif;

        color: var(--text);

        background:
            radial-gradient(
                circle at 50% 18%,
                rgba(110, 70, 180, 0.18),
                transparent 35%
            ),
            radial-gradient(
                circle at 20% 80%,
                rgba(40, 80, 180, 0.10),
                transparent 35%
            ),
            linear-gradient(
                180deg,
                #060710 0%,
                #0a0b19 45%,
                #101225 100%
            );

        overflow-x: hidden;
    }

    /* =========================
       BACKGROUND STARS
    ========================= */

    .space {
        position: fixed;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
        z-index: 0;
    }

    .star {
        position: absolute;
        width: 2px;
        height: 2px;
        border-radius: 50%;
        background: rgba(255,255,255,0.7);
        animation: twinkle 3s ease-in-out infinite;
    }

    .star:nth-child(1) { left: 8%; top: 13%; animation-delay: .3s; }
    .star:nth-child(2) { left: 21%; top: 30%; animation-delay: 1.2s; }
    .star:nth-child(3) { left: 34%; top: 8%; animation-delay: 2s; }
    .star:nth-child(4) { left: 47%; top: 22%; animation-delay: .8s; }
    .star:nth-child(5) { left: 63%; top: 11%; animation-delay: 1.7s; }
    .star:nth-child(6) { left: 76%; top: 28%; animation-delay: .4s; }
    .star:nth-child(7) { left: 90%; top: 17%; animation-delay: 2.3s; }
    .star:nth-child(8) { left: 14%; top: 55%; animation-delay: 1.1s; }
    .star:nth-child(9) { left: 29%; top: 69%; animation-delay: 2.1s; }
    .star:nth-child(10) { left: 51%; top: 59%; animation-delay: .5s; }
    .star:nth-child(11) { left: 71%; top: 71%; animation-delay: 1.4s; }
    .star:nth-child(12) { left: 88%; top: 62%; animation-delay: 2.4s; }
    .star:nth-child(13) { left: 5%; top: 86%; animation-delay: .7s; }
    .star:nth-child(14) { left: 40%; top: 91%; animation-delay: 1.9s; }
    .star:nth-child(15) { left: 81%; top: 91%; animation-delay: .9s; }

    @keyframes twinkle {
        0%, 100% {
            opacity: .25;
            transform: scale(.7);
        }

        50% {
            opacity: 1;
            transform: scale(1.5);
        }
    }

    /* =========================
       MAIN
    ========================= */

    .app {
        position: relative;
        z-index: 2;

        width: 100%;
        max-width: 430px;

        margin: 0 auto;

        display: flex;
        flex-direction: column;
        align-items: center;
    }

    /* =========================
       OBJECT NAME
    ========================= */

    .object-name {
        margin-top: 2px;

        font-size: 22px;
        font-weight: 700;

        letter-spacing: 1px;

        text-align: center;

        text-shadow:
            0 0 15px rgba(255,255,255,.15);
    }

    .object-type {
        margin-top: 3px;

        font-size: 9px;
        letter-spacing: 3px;

        text-transform: uppercase;

        color: rgba(255,255,255,.35);
    }

    /* =========================
       BALANCE
    ========================= */

    .balance-label {
        margin-top: 15px;

        font-size: 10px;
        font-weight: 600;

        letter-spacing: 3px;

        color: rgba(255,255,255,.43);

        text-transform: uppercase;
    }

    .balance {
        margin-top: 1px;

        font-size: 48px;
        line-height: 1;

        font-weight: 800;

        letter-spacing: -2px;

        color: #fff;

        text-shadow:
            0 0 12px rgba(255,179,71,.18),
            0 0 35px rgba(255,179,71,.15);

        transition: transform .12s ease;
    }

    .balance.bump {
        transform: scale(1.08);
    }

    /* =========================
       OBJECT
    ========================= */

    .object-wrap {
        position: relative;

        width: min(300px, 82vw);
        height: min(300px, 82vw);

        margin: 8px 0 10px;

        cursor: pointer;

        display: flex;
        align-items: center;
        justify-content: center;

        touch-action: manipulation;
    }

    .object-aura {
        position: absolute;

        width: 90%;
        height: 90%;

        border-radius: 50%;

        background:
            radial-gradient(
                circle,
                rgba(255,190,100,.22) 0%,
                rgba(255,150,70,.12) 30%,
                transparent 70%
            );

        filter: blur(8px);

        transition:
            transform .3s ease,
            opacity .3s ease,
            filter .3s ease;
    }

    .object-ring {
        position: absolute;

        width: 82%;
        height: 82%;

        border-radius: 50%;

        border: 1px solid rgba(255,255,255,.06);

        box-shadow:
            0 0 50px rgba(150,100,255,.08),
            inset 0 0 40px rgba(255,255,255,.025);
    }

    .object-img {
        position: absolute;

        width: 82%;
        height: 82%;

        object-fit: contain;

        z-index: 3;

        transition:
            transform .08s ease,
            filter .35s ease;

        -webkit-user-drag: none;

        /*
         * У PNG прозрачный фон должен остаться прозрачным.
         */
        mix-blend-mode: normal;
    }

    .cracks-overlay {
        position: absolute;

        width: 82%;
        height: 82%;

        object-fit: contain;

        z-index: 4;

        pointer-events: none;

        transition:
            opacity .5s ease,
            transform .2s ease;

        mix-blend-mode: normal;
    }

    .object-wrap:active .object-img {
        transform: scale(.94);
    }

    .object-wrap.hit .object-img {
        animation: objectHit .18s ease;
    }

    .object-wrap.hit .object-aura {
        animation: auraHit .25s ease;
    }

    @keyframes objectHit {
        0% {
            transform: scale(1);
        }

        45% {
            transform: scale(.91);
        }

        100% {
            transform: scale(1);
        }
    }

    @keyframes auraHit {
        0% {
            transform: scale(1);
            opacity: 1;
        }

        50% {
            transform: scale(1.15);
            opacity: .75;
        }

        100% {
            transform: scale(1);
            opacity: 1;
        }
    }

    /* =========================
       FLOAT TEXT
    ========================= */

    .float-text {
        position: fixed;

        z-index: 100;

        pointer-events: none;

        font-size: 21px;
        font-weight: 800;

        color: var(--gold-light);

        text-shadow:
            0 0 8px rgba(255,179,71,.5),
            0 2px 8px rgba(0,0,0,.7);

        animation:
            floatUp .75s cubic-bezier(.2,.8,.3,1) forwards;
    }

    @keyframes floatUp {
        0% {
            transform:
                translateY(0)
                scale(.8);

            opacity: 0;
        }

        15% {
            opacity: 1;
        }

        100% {
            transform:
                translateY(-75px)
                scale(1.1);

            opacity: 0;
        }
    }

    /* =========================
       PROGRESS
    ========================= */

    .progress-block,
    .stamina-block {
        width: 100%;
        max-width: 370px;
    }

    .progress-block {
        margin-top: 2px;
    }

    .stamina-block {
        margin-top: 10px;
    }

    .bar-header {
        display: flex;
        align-items: center;
        justify-content: space-between;

        margin-bottom: 5px;

        font-size: 11px;
    }

    .bar-title {
        display: flex;
        align-items: center;
        gap: 6px;

        color: rgba(255,255,255,.65);
    }

    .bar-value {
        color: rgba(255,255,255,.72);

        font-variant-numeric: tabular-nums;
    }

    .bar-bg {
        width: 100%;
        height: 8px;

        padding: 1px;

        border-radius: 99px;

        background: rgba(255,255,255,.08);

        box-shadow:
            inset 0 1px 2px rgba(0,0,0,.5);
    }

    .bar-fill {
        height: 100%;

        width: 0%;

        border-radius: 99px;

        transition: width .3s ease;
    }

    .progress-bar-fill {
        background:
            linear-gradient(
                90deg,
                #8251e9,
                #bd68f5
            );

        box-shadow:
            0 0 12px rgba(168,85,247,.55);
    }

    .stamina-bar-fill {
        background:
            linear-gradient(
                90deg,
                #3988ed,
                #72c0ff
            );

        box-shadow:
            0 0 12px rgba(79,163,255,.45);
    }

    /* =========================
       DAILY
    ========================= */

    .daily-card {
        width: 100%;
        max-width: 370px;

        margin-top: 17px;

        padding: 14px;

        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;

        border-radius: 17px;

        background:
            linear-gradient(
                135deg,
                rgba(255,179,71,.13),
                rgba(255,100,50,.07)
            );

        border: 1px solid rgba(255,179,71,.25);

        box-shadow:
            0 8px 30px rgba(0,0,0,.18);
    }

    .daily-info {
        min-width: 0;
    }

    .daily-title {
        font-size: 14px;
        font-weight: 750;
    }

    .daily-sub {
        margin-top: 3px;

        font-size: 10px;

        color: rgba(255,255,255,.55);
    }

    button {
        font-family: inherit;

        border: none;

        cursor: pointer;

        touch-action: manipulation;
    }

    .daily-btn {
        flex-shrink: 0;

        padding: 9px 15px;

        border-radius: 11px;

        background:
            linear-gradient(
                135deg,
                #ffc15b,
                #ff9017
            );

        color: #18120b;

        font-size: 12px;
        font-weight: 800;

        box-shadow:
            0 4px 15px rgba(255,143,24,.25);

        transition:
            transform .1s ease,
            filter .2s ease;
    }

    .daily-btn:active {
        transform: scale(.95);
    }

    .daily-btn:disabled {
        background: rgba(255,255,255,.08);
        color: rgba(255,255,255,.32);
        box-shadow: none;
    }

    /* =========================
       PRESTIGE
    ========================= */

    .prestige-btn {
        width: 100%;
        max-width: 370px;

        margin-top: 12px;

        padding: 14px;

        border-radius: 16px;

        background:
            linear-gradient(
                135deg,
                #9959ee,
                #d24ee9
            );

        color: white;

        font-size: 14px;
        font-weight: 800;

        box-shadow:
            0 6px 25px rgba(168,85,247,.25);

        transition:
            transform .1s ease,
            filter .2s ease;
    }

    .prestige-btn:active:not(:disabled) {
        transform: scale(.98);
    }

    .prestige-btn:disabled {
        background:
            linear-gradient(
                135deg,
                rgba(255,255,255,.08),
                rgba(255,255,255,.06)
            );

        color: rgba(255,255,255,.28);

        box-shadow: none;

        cursor: default;
    }

    /* =========================
       UPGRADES
    ========================= */

    .upgrades {
        width: 100%;
        max-width: 370px;

        display: flex;
        flex-direction: column;

        gap: 9px;

        margin-top: 11px;
    }

    .upgrade-card {
        width: 100%;

        padding: 13px 14px;

        display: flex;
        align-items: center;
        justify-content: space-between;

        border-radius: 16px;

        background:
            linear-gradient(
                135deg,
                rgba(255,255,255,.075),
                rgba(255,255,255,.035)
            );

        border: 1px solid rgba(255,255,255,.09);

        box-shadow:
            0 5px 20px rgba(0,0,0,.12);
    }

    .upgrade-info {
        min-width: 0;
    }

    .upgrade-title {
        font-size: 14px;
        font-weight: 750;
    }

    .upgrade-sub {
        margin-top: 3px;

        font-size: 10px;

        color: rgba(255,255,255,.48);
    }

    .upgrade-btn {
        min-width: 64px;

        padding: 10px 13px;

        border-radius: 12px;

        background:
            linear-gradient(
                135deg,
                #ffbd50,
                #ff8e18
            );

        color: #18120b;

        font-size: 12px;
        font-weight: 850;

        box-shadow:
            0 3px 12px rgba(255,150,30,.15);

        transition:
            transform .1s ease,
            filter .2s ease;
    }

    .upgrade-btn:active:not(:disabled) {
        transform: scale(.94);
    }

    .upgrade-btn:disabled {
        background: rgba(255,255,255,.10);
        color: rgba(255,255,255,.3);

        box-shadow: none;
    }

    /* =========================
       STATUS
    ========================= */

    .status {
        margin-top: 15px;

        font-size: 10px;

        color: rgba(255,255,255,.3);

        text-align: center;
    }

    /* =========================
       PARTICLE
    ========================= */

    .click-particle {
        position: fixed;

        width: 5px;
        height: 5px;

        border-radius: 50%;

        background: #ffd27a;

        pointer-events: none;

        z-index: 90;

        animation: particle .45s ease-out forwards;
    }

    @keyframes particle {
        from {
            opacity: 1;
            transform: translate(0,0) scale(1);
        }

        to {
            opacity: 0;
            transform:
                translate(
                    var(--x),
                    var(--y)
                )
                scale(.2);
        }
    }

    /* =========================
       SMALL SCREENS
    ========================= */

    @media (max-height: 700px) {
        body {
            padding-top: 5px;
        }

        .balance-label {
            margin-top: 8px;
        }

        .object-wrap {
            width: 250px;
            height: 250px;

            margin-top: 4px;
            margin-bottom: 4px;
        }

        .daily-card {
            margin-top: 11px;
        }

        .upgrade-card {
            padding-top: 10px;
            padding-bottom: 10px;
        }
    }

    @media (max-width: 350px) {
        body {
            padding-left: 10px;
            padding-right: 10px;
        }

        .balance {
            font-size: 42px;
        }

        .object-wrap {
            width: 250px;
            height: 250px;
        }

        .daily-title,
        .upgrade-title {
            font-size: 13px;
        }
    }
</style>
</head>

<body>

<script>
    /* =========================================================
       TELEGRAM
    ========================================================= */

    const tg = window.Telegram?.WebApp;

    if (tg) {
        tg.ready();
        tg.expand();

        try {
            tg.setHeaderColor('#070812');
            tg.setBackgroundColor('#070812');
        } catch (e) {}
    }


    /* =========================================================
       USER / API
    ========================================================= */

    const userId =
        tg?.initDataUnsafe?.user?.id || 12345;

    const API_URL =
        window.location.origin;


    /* =========================================================
       ELEMENTS
    ========================================================= */

    const objectNameEl =
        document.getElementById('object-name');

    const objectTypeEl =
        document.getElementById('object-type');

    const balanceEl =
        document.getElementById('balance');

    const objectWrapEl =
        document.getElementById('object-wrap');

    const objectImgEl =
        document.getElementById('object-img');

    const objectAuraEl =
        document.getElementById('object-aura');

    const cracksOverlayEl =
        document.getElementById('cracks-overlay');

    const statusEl =
        document.getElementById('status');

    const progressTextEl =
        document.getElementById('progress-text');

    const progressFillEl =
        document.getElementById('progress-fill');

    const staminaTextEl =
        document.getElementById('stamina-text');

    const staminaFillEl =
        document.getElementById('stamina-fill');

    const clickLevelTextEl =
        document.getElementById('click-level-text');

    const staminaLevelTextEl =
        document.getElementById('stamina-level-text');

    const upgradeClickBtn =
        document.getElementById('upgrade-click-btn');

    const upgradeStaminaBtn =
        document.getElementById('upgrade-stamina-btn');

    const prestigeBtn =
        document.getElementById('prestige-btn');

    const dailySubEl =
        document.getElementById('daily-sub');

    const dailyBtn =
        document.getElementById('daily-btn');


    /* =========================================================
       STATE
    ========================================================= */

    let state = null;

    let objectsList = [];

    let pendingTaps = 0;

    let sendTimeout = null;

    let localStamina = 0;

    let currentObjectIndex = -1;


    /* =========================================================
       OBJECTS
    ========================================================= */

    async function loadObjectsList() {

        try {

            const res =
                await fetch(`${API_URL}/api/objects`);

            if (!res.ok) {
                throw new Error('Objects request failed');
            }

            objectsList =
                await res.json();

        } catch (error) {

            console.error(error);

            statusEl.textContent =
                'Ошибка загрузки объектов';

        }
    }


    /* =========================================================
       OBJECT VISUAL
    ========================================================= */

    function updateObjectVisual() {

        if (!state) {
            return;
        }


        if (
            currentObjectIndex !==
            state.object_index
        ) {

            currentObjectIndex =
                state.object_index;

            const obj =
                objectsList[state.object_index];


            if (obj) {

                objectImgEl.src =
                    `/images/${obj.image}`;

            }


            const category =
                state.object_category || 'planet';


            if (category === 'planet') {

                cracksOverlayEl.style.display =
                    'block';

            } else {

                cracksOverlayEl.style.display =
                    'none';

            }


            objectTypeEl.textContent =
                getObjectTypeName(category);
        }


        let progressPct = 0;


        if (state.object_threshold) {

            progressPct =
                Math.min(
                    100,
                    (
                        state.object_progress /
                        state.object_threshold
                    ) * 100
                );

        } else {

            progressPct = 100;

        }


        /* CRACKS */

        if (
            state.object_category ===
            'planet'
        ) {

            cracksOverlayEl.style.opacity =
                Math.max(
                    0.05,
                    1 - (progressPct / 100) * 0.9
                );

        }


        /* BRIGHTNESS */

        if (
            state.object_category === 'star' ||
            state.object_category === 'blackhole'
        ) {

            const brightness =
                0.65 +
                (progressPct / 100) * 0.75;

            objectImgEl.style.filter =
                `brightness(${brightness})`;

            objectAuraEl.style.filter =
                `brightness(${brightness})`;

        } else {

            objectImgEl.style.filter =
                'none';

            objectAuraEl.style.filter =
                'none';

        }


        /* AURA */

        const auraScale =
            0.9 +
            (progressPct / 100) * 0.15;

        objectAuraEl.style.transform =
            `scale(${auraScale})`;
    }


    function getObjectTypeName(category) {

        switch (category) {

            case 'planet':
                return 'PLANET';

            case 'star':
                return 'STAR';

            case 'blackhole':
                return 'BLACK HOLE';

            default:
                return 'CELESTIAL OBJECT';
        }
    }


    /* =========================================================
       RENDER STATE
    ========================================================= */

    function renderState() {

        if (!state) {
            return;
        }


        objectNameEl.textContent =
            state.object_name;


        balanceEl.textContent =
            state.balance;


        /* STAMINA */

        const staminaPct =
            Math.max(
                0,
                Math.min(
                    100,
                    (
                        localStamina /
                        state.stamina_max
                    ) * 100
                )
            );


        staminaFillEl.style.width =
            staminaPct + '%';


        staminaTextEl.textContent =
            `${Math.floor(localStamina)}/${state.stamina_max}`;


        /* PROGRESS */

        if (state.object_threshold) {

            const progressPct =
                Math.min(
                    100,
                    (
                        state.object_progress /
                        state.object_threshold
                    ) * 100
                );


            progressFillEl.style.width =
                progressPct + '%';


            progressTextEl.textContent =
                `${state.object_progress}/${state.object_threshold}`;

        } else {

            progressFillEl.style.width =
                '100%';

            progressTextEl.textContent =
                'Финал';

        }


        /* CLICK UPGRADE */

        clickLevelTextEl.textContent =
            `Уровень ${state.click_level} · +${state.click_power} монета`;


        if (
            state.click_upgrade_cost === -1
        ) {

            upgradeClickBtn.textContent =
                'MAX';

            upgradeClickBtn.disabled =
                true;

        } else {

            upgradeClickBtn.textContent =
                state.click_upgrade_cost;

            upgradeClickBtn.disabled =
                state.balance <
                state.click_upgrade_cost;
        }


        /* STAMINA UPGRADE */

        staminaLevelTextEl.textContent =
            `Уровень ${state.stamina_level} · макс ${state.stamina_max}`;


        if (
            state.stamina_upgrade_cost === -1
        ) {

            upgradeStaminaBtn.textContent =
                'MAX';

            upgradeStaminaBtn.disabled =
                true;

        } else {

            upgradeStaminaBtn.textContent =
                state.stamina_upgrade_cost;

            upgradeStaminaBtn.disabled =
                state.balance <
                state.stamina_upgrade_cost;
        }


        /* PRESTIGE */

        if (state.is_final_object) {

            prestigeBtn.textContent =
                '🌟 Это финальный объект!';

            prestigeBtn.disabled =
                true;

        } else if (state.can_prestige) {

            prestigeBtn.textContent =
                '🚀 Лететь дальше (+60% навсегда)';

            prestigeBtn.disabled =
                false;

        } else {

            prestigeBtn.textContent =
                'Набери прогресс для перелёта';

            prestigeBtn.disabled =
                true;
        }


        /* DAILY */

        const daily =
            state.daily_status;


        dailySubEl.textContent =
            `Стрик: ${state.daily_streak} дн. · +${state.daily_next_amount} монет`;


        if (daily.can_claim) {

            dailyBtn.textContent =
                'Забрать';

            dailyBtn.disabled =
                false;

        } else {

            dailyBtn.textContent =
                `${daily.hours_until_next}ч`;

            dailyBtn.disabled =
                true;
        }


        updateObjectVisual();
    }


    /* =========================================================
       LOAD STATE
    ========================================================= */

    async function loadState() {

        try {

            const res =
                await fetch(
                    `${API_URL}/api/state/${userId}`
                );


            if (!res.ok) {
                throw new Error('State request failed');
            }


            state =
                await res.json();


            localStamina =
                state.stamina;


            statusEl.textContent =
                `ID: ${userId} · Перелётов: ${state.prestige_count}`;


            renderState();

        } catch (error) {

            console.error(error);

            statusEl.textContent =
                'Ошибка загрузки сервера';
        }
    }


    /* =========================================================
       STAMINA REGEN
    ========================================================= */

    setInterval(() => {

        if (
            state &&
            localStamina <
            state.stamina_max
        ) {

            localStamina =
                Math.min(
                    state.stamina_max,
                    localStamina + 2 * 0.2
                );

            renderState();
        }

    }, 200);


    /* =========================================================
       SEND CLICKS
    ========================================================= */

    function scheduleSend() {

        clearTimeout(sendTimeout);


        sendTimeout =
            setTimeout(async () => {

                const taps =
                    pendingTaps;


                pendingTaps = 0;


                if (taps === 0) {
                    return;
                }


                try {

                    const res =
                        await fetch(
                            `${API_URL}/api/click`,
                            {
                                method: 'POST',

                                headers: {
                                    'Content-Type':
                                        'application/json'
                                },

                                body:
                                    JSON.stringify({
                                        user_id: userId,
                                        taps: taps
                                    })
                            }
                        );


                    if (res.ok) {

                        state =
                            await res.json();


                        localStamina =
                            state.stamina;


                        renderState();

                    } else {

                        statusEl.textContent =
                            'Ошибка клика';

                    }

                } catch (error) {

                    console.error(error);

                    statusEl.textContent =
                        'Ошибка синхронизации';
                }

            }, 400);
    }


    /* =========================================================
       FLOAT TEXT
    ========================================================= */

    function showFloatText(
        x,
        y,
        amount
    ) {

        const el =
            document.createElement('div');


        el.className =
            'float-text';


        el.textContent =
            '+' + amount;


        el.style.left =
            x + 'px';


        el.style.top =
            y + 'px';


        document.body.appendChild(el);


        setTimeout(() => {

            el.remove();

        }, 800);
    }


    /* =========================================================
       PARTICLES
    ========================================================= */

    function createParticles(
        x,
        y
    ) {

        for (
            let i = 0;
            i < 5;
            i++
        ) {

            const particle =
                document.createElement('div');


            particle.className =
                'click-particle';


            particle.style.left =
                x + 'px';


            particle.style.top =
                y + 'px';


            const angle =
                Math.random() *
                Math.PI *
                2;


            const distance =
                20 +
                Math.random() * 35;


            particle.style.setProperty(
                '--x',
                `${Math.cos(angle) * distance}px`
            );


            particle.style.setProperty(
                '--y',
                `${Math.sin(angle) * distance}px`
            );


            document.body.appendChild(
                particle
            );


            setTimeout(() => {

                particle.remove();

            }, 500);
        }
    }


    /* =========================================================
       CLICK OBJECT
    ========================================================= */

    objectWrapEl.addEventListener(
        'click',
        (e) => {

            if (
                !state ||
                localStamina < 1
            ) {
                return;
            }


            localStamina -= 1;


            pendingTaps += 1;


            const prestigeMult =
                state.prestige_multiplier ||
                1;


            const earnedThisClick =
                Math.round(
                    state.click_power *
                    prestigeMult
                );


            /*
             * Локально показываем ожидаемый баланс.
             * Сервер всё равно остаётся главным источником данных.
             */

            const temporaryBalance =
                state.balance +
                Math.round(
                    pendingTaps *
                    state.click_power *
                    prestigeMult
                );


            balanceEl.textContent =
                temporaryBalance;


            /* ANIMATION */

            objectWrapEl.classList.remove(
                'hit'
            );


            void objectWrapEl.offsetWidth;


            objectWrapEl.classList.add(
                'hit'
            );


            balanceEl.classList.remove(
                'bump'
            );


            void balanceEl.offsetWidth;


            balanceEl.classList.add(
                'bump'
            );


            setTimeout(() => {

                balanceEl.classList.remove(
                    'bump'
                );

            }, 130);


            /* FLOAT TEXT */

            showFloatText(
                e.clientX - 10,
                e.clientY - 20,
                earnedThisClick
            );


            /* PARTICLES */

            createParticles(
                e.clientX,
                e.clientY
            );


            renderState();


            scheduleSend();


            /* TELEGRAM HAPTIC */

            try {

                tg?.HapticFeedback?.impactOccurred(
                    'light'
                );

            } catch (error) {}
        }
    );


    /* =========================================================
       CLICK UPGRADE
    ========================================================= */

    upgradeClickBtn.addEventListener(
        'click',
        async () => {

            try {

                upgradeClickBtn.disabled =
                    true;


                const res =
                    await fetch(
                        `${API_URL}/api/upgrade/click`,
                        {
                            method: 'POST',

                            headers: {
                                'Content-Type':
                                    'application/json'
                            },

                            body:
                                JSON.stringify({
                                    user_id: userId
                                })
                        }
                    );


                if (res.ok) {

                    state =
                        await res.json();


                    localStamina =
                        state.stamina;


                    renderState();


                    tg?.HapticFeedback?.notificationOccurred(
                        'success'
                    );

                } else {

                    renderState();
                }

            } catch (error) {

                console.error(error);

                statusEl.textContent =
                    'Ошибка улучшения';

                renderState();
            }
        }
    );


    /* =========================================================
       STAMINA UPGRADE
    ========================================================= */

    upgradeStaminaBtn.addEventListener(
        'click',
        async () => {

            try {

                upgradeStaminaBtn.disabled =
                    true;


                const res =
                    await fetch(
                        `${API_URL}/api/upgrade/stamina`,
                        {
                            method: 'POST',

                            headers: {
                                'Content-Type':
                                    'application/json'
                            },

                            body:
                                JSON.stringify({
                                    user_id: userId
                                })
                        }
                    );


                if (res.ok) {

                    state =
                        await res.json();


                    localStamina =
                        state.stamina;


                    renderState();


                    tg?.HapticFeedback?.notificationOccurred(
                        'success'
                    );

                } else {

                    renderState();
                }

            } catch (error) {

                console.error(error);

                statusEl.textContent =
                    'Ошибка улучшения';

                renderState();
            }
        }
    );


    /* =========================================================
       PRESTIGE
    ========================================================= */

    prestigeBtn.addEventListener(
        'click',
        async () => {

            if (
                !state ||
                !state.can_prestige
            ) {
                return;
            }


            try {

                prestigeBtn.disabled =
                    true;


                const res =
                    await fetch(
                        `${API_URL}/api/prestige`,
                        {
                            method: 'POST',

                            headers: {
                                'Content-Type':
                                    'application/json'
                            },

                            body:
                                JSON.stringify({
                                    user_id: userId
                                })
                        }
                    );


                if (res.ok) {

                    state =
                        await res.json();


                    localStamina =
                        state.stamina;


                    statusEl.textContent =
                        `ID: ${userId} · Перелётов: ${state.prestige_count}`;


                    renderState();


                    tg?.HapticFeedback?.notificationOccurred(
                        'success'
                    );

                } else {

                    renderState();
                }

            } catch (error) {

                console.error(error);

                statusEl.textContent =
                    'Ошибка перелёта';

                renderState();
            }
        }
    );


    /* =========================================================
       DAILY BONUS
    ========================================================= */

    dailyBtn.addEventListener(
        'click',
        async () => {

            try {

                dailyBtn.disabled =
                    true;


                const res =
                    await fetch(
                        `${API_URL}/api/daily/claim`,
                        {
                            method: 'POST',

                            headers: {
                                'Content-Type':
                                    'application/json'
                            },

                            body:
                                JSON.stringify({
                                    user_id: userId
                                })
                        }
                    );


                if (res.ok) {

                    state =
                        await res.json();


                    localStamina =
                        state.stamina;


                    renderState();


                    tg?.HapticFeedback?.notificationOccurred(
                        'success'
                    );

                } else {

                    renderState();
                }

            } catch (error) {

                console.error(error);

                statusEl.textContent =
                    'Ошибка получения бонуса';

                renderState();
            }
        }
    );


    /* =========================================================
       INIT
    ========================================================= */

    async function init() {

        statusEl.textContent =
            'Подключение к Sundered Star...';


        await loadObjectsList();

        await loadState();

    }


    init();

</script>
