<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Sundered Star</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
}

:root {
    --bg: #050711;
    --panel: rgba(15, 19, 38, .78);
    --panel-border: rgba(255,255,255,.09);

    --text: #f5f7ff;
    --muted: rgba(230,235,255,.55);

    --gold: #ffc76b;
    --gold2: #ff8b38;

    --blue: #65b9ff;
    --purple: #9d70ff;
    --pink: #ed69ff;

    --green: #63e6a8;
}

html,
body {
    min-height: 100%;
    background: var(--bg);
}

body {
    min-height: 100vh;
    overflow-x: hidden;
    color: var(--text);
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        sans-serif;

    background:
        radial-gradient(
            circle at 50% 22%,
            rgba(91, 62, 170, .22),
            transparent 34%
        ),
        radial-gradient(
            circle at 10% 90%,
            rgba(36, 105, 180, .12),
            transparent 35%
        ),
        linear-gradient(
            180deg,
            #04050c 0%,
            #080a17 45%,
            #101326 100%
        );
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: .32;

    background-image:
        radial-gradient(circle, rgba(255,255,255,.75) 1px, transparent 1px),
        radial-gradient(circle, rgba(255,255,255,.45) 1px, transparent 1px);

    background-size: 83px 83px, 137px 137px;
    background-position: 12px 20px, 40px 70px;
}

.app {
    position: relative;
    z-index: 1;

    width: 100%;
    max-width: 430px;

    margin: 0 auto;
    padding: 18px 15px 28px;
}

/* ================= HEADER ================= */

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;

    margin-bottom: 12px;
}

.logo {
    font-size: 14px;
    font-weight: 800;
    letter-spacing: 2.5px;
}

.logo span {
    color: var(--gold);
}

.expedition {
    padding: 7px 10px;

    border-radius: 999px;

    background: rgba(255,255,255,.055);
    border: 1px solid rgba(255,255,255,.08);

    font-size: 9px;
    letter-spacing: 1px;
    color: var(--muted);
}

/* ================= MISSION ================= */

.mission {
    text-align: center;
    margin-top: 4px;
}

.mission-kicker {
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 2.5px;
    color: var(--muted);
}

.object-name {
    margin-top: 5px;

    font-size: 25px;
    font-weight: 800;

    letter-spacing: .5px;

    text-shadow:
        0 0 24px rgba(255,255,255,.12);
}

.object-name::before {
    content: "✦ ";
    color: var(--gold);
}

/* ================= BALANCE ================= */

.balance-card {
    text-align: center;
    margin-top: 13px;
}

.balance-label {
    font-size: 9px;
    color: var(--muted);
    letter-spacing: 2px;
    text-transform: uppercase;
}

.balance {
    margin-top: 2px;

    font-size: 38px;
    line-height: 1;

    font-weight: 900;

    background:
        linear-gradient(
            180deg,
            #fff8e7,
            #ffc76b 65%,
            #ff8b38
        );

    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;

    filter:
        drop-shadow(0 0 14px rgba(255,170,65,.18));
}

/* ================= OBJECT ================= */

.object-zone {
    position: relative;

    width: 290px;
    height: 290px;

    margin: 3px auto 0;

    display: flex;
    align-items: center;
    justify-content: center;
}

.object-zone::before {
    content: "";

    position: absolute;

    width: 245px;
    height: 245px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(255,190,90,.18),
            rgba(130,85,255,.08) 42%,
            transparent 70%
        );

    filter: blur(9px);

    transition:
        transform .5s ease,
        opacity .5s ease;
}

.object-zone::after {
    content: "";

    position: absolute;

    width: 215px;
    height: 215px;

    border-radius: 50%;

    border:
        1px solid rgba(255,255,255,.055);

    box-shadow:
        0 0 45px rgba(119,92,255,.08),
        inset 0 0 35px rgba(255,255,255,.025);

    pointer-events: none;
}

.object-wrap {
    position: relative;

    width: 230px;
    height: 230px;

    cursor: pointer;

    z-index: 2;
}

.object-img {
    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: contain;

    transition:
        transform .08s ease,
        filter .45s ease;

    -webkit-user-drag: none;

    filter:
        drop-shadow(
            0 0 25px rgba(255,180,80,.12)
        );
}

.cracks-overlay {
    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: contain;

    pointer-events: none;

    mix-blend-mode: multiply;

    transition:
        opacity .7s ease;
}

.object-wrap:active .object-img {
    transform: scale(.91);
}

/* ================= CLICK EFFECT ================= */

.click-ring {
    position: fixed;

    width: 25px;
    height: 25px;

    margin-left: -12px;
    margin-top: -12px;

    border-radius: 50%;

    border: 2px solid rgba(255,195,105,.9);

    pointer-events: none;

    animation: clickRing .55s ease-out forwards;

    z-index: 20;
}

@keyframes clickRing {
    0% {
        transform: scale(.5);
        opacity: 1;
    }

    100% {
        transform: scale(3);
        opacity: 0;
    }
}

.float-text {
    position: fixed;

    color: var(--gold);

    font-size: 20px;
    font-weight: 900;

    pointer-events: none;

    text-shadow:
        0 0 12px rgba(255,160,50,.7),
        0 2px 4px rgba(0,0,0,.6);

    animation:
        floatUp .8s ease-out forwards;

    z-index: 30;
}

@keyframes floatUp {
    0% {
        transform:
            translateY(0)
            scale(.85);

        opacity: 0;
    }

    15% {
        opacity: 1;
    }

    100% {
        transform:
            translateY(-75px)
            scale(1.1);

        opacity: 0;
    }
}

/* ================= PROGRESS ================= */

.panel {
    width: 100%;

    background: var(--panel);

    border:
        1px solid var(--panel-border);

    border-radius: 17px;

    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);

    box-shadow:
        0 10px 35px rgba(0,0,0,.22);

    padding: 13px 14px;
}

.progress-head,
.stamina-head {
    display: flex;
    justify-content: space-between;
    align-items: center;

    font-size: 10px;
}

.progress-title,
.stamina-title {
    color: var(--muted);
}

.progress-value,
.stamina-value {
    font-weight: 700;
}

.bar {
    width: 100%;
    height: 9px;

    margin-top: 7px;

    background: rgba(255,255,255,.07);

    border-radius: 999px;

    overflow: hidden;
}

.bar-fill {
    height: 100%;

    width: 0%;

    border-radius: inherit;

    transition: width .3s ease;
}

.progress-fill {
    background:
        linear-gradient(
            90deg,
            var(--purple),
            var(--pink)
        );

    box-shadow:
        0 0 12px rgba(170,95,255,.45);
}

.stamina-fill {
    background:
        linear-gradient(
            90deg,
            #4b9df5,
            #70d4ff
        );

    box-shadow:
        0 0 12px rgba(80,180,255,.35);
}

.stamina-section {
    margin-top: 13px;
}

/* ================= DAILY ================= */

.daily {
    margin-top: 10px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    gap: 10px;

    background:
        linear-gradient(
            135deg,
            rgba(255,180,70,.13),
            rgba(255,90,60,.05)
        );

    border:
        1px solid rgba(255,185,80,.18);

    border-radius: 17px;

    padding: 13px 14px;
}

.daily-icon {
    width: 38px;
    height: 38px;

    display: flex;
    align-items: center;
    justify-content: center;

    flex-shrink: 0;

    border-radius: 12px;

    background:
        rgba(255,180,70,.13);

    font-size: 19px;
}

.daily-info {
    flex: 1;
    text-align: left;
}

.daily-title {
    font-size: 12px;
    font-weight: 800;
}

.daily-sub {
    margin-top: 3px;

    font-size: 9px;

    color: var(--muted);
}

.daily-btn {
    border: 0;

    padding: 9px 13px;

    border-radius: 11px;

    background:
        linear-gradient(
            135deg,
            var(--gold),
            var(--gold2)
        );

    color: #211307;

    font-size: 10px;
    font-weight: 900;
}

.daily-btn:disabled {
    background: rgba(255,255,255,.07);
    color: rgba(255,255,255,.3);
}

/* ================= PRESTIGE ================= */

.prestige-btn {
    width: 100%;

    margin-top: 10px;

    border: 0;

    border-radius: 17px;

    padding: 14px;

    color: white;

    font-size: 12px;
    font-weight: 900;

    background:
        linear-gradient(
            135deg,
            #7651e8,
            #d84df2
        );

    box-shadow:
        0 8px 28px rgba(155,70,240,.22);

    transition:
        transform .12s ease,
        opacity .2s ease;
}

.prestige-btn:not(:disabled):active {
    transform: scale(.97);
}

.prestige-btn:disabled {
    background: rgba(255,255,255,.055);
    color: rgba(255,255,255,.28);
    box-shadow: none;
}

/* ================= UPGRADES ================= */

.section-title {
    margin: 18px 2px 8px;

    font-size: 9px;

    color: var(--muted);

    text-transform: uppercase;
    letter-spacing: 2px;
}

.upgrades {
    display: grid;
    grid-template-columns: 1fr 1fr;

    gap: 9px;
}

.upgrade-card {
    min-width: 0;

    padding: 13px;

    background:
        rgba(255,255,255,.045);

    border:
        1px solid rgba(255,255,255,.08);

    border-radius: 16px;
}

.upgrade-icon {
    font-size: 18px;
}

.upgrade-title {
    margin-top: 7px;

    font-size: 11px;
    font-weight: 800;
}

.upgrade-sub {
    margin-top: 3px;

    min-height: 25px;

    font-size: 8px;

    line-height: 1.4;

    color: var(--muted);
}

.upgrade-btn {
    width: 100%;

    margin-top: 10px;

    border: 0;

    border-radius: 10px;

    padding: 9px 5px;

    background:
        linear-gradient(
            135deg,
            #ffbd5b,
            #ff8c32
        );

    color: #211307;

    font-size: 10px;
    font-weight: 900;
}

.upgrade-btn:disabled {
    background: rgba(255,255,255,.07);
    color: rgba(255,255,255,.3);
}

/* ================= STATUS ================= */

.status {
    margin-top: 16px;

    text-align: center;

    font-size: 8px;

    color: rgba(255,255,255,.28);

    letter-spacing: .5px;
}

/* ================= RESPONSIVE ================= */

@media (max-height: 700px) {
    .app {
        padding-top: 10px;
    }

    .object-zone {
        width: 250px;
        height: 250px;
    }

    .object-wrap {
        width: 200px;
        height: 200px;
    }

    .object-zone::before {
        width: 215px;
        height: 215px;
    }

    .object-zone::after {
        width: 190px;
        height: 190px;
    }

    .balance {
        font-size: 32px;
    }
}
</style>
</head>

<body>

<div class="app">

    <header class="header">
        <div class="logo">
            SUNDERED <span>STAR</span>
        </div>

        <div class="expedition">
            EXPEDITION
        </div>
    </header>


    <section class="mission">

        <div class="mission-kicker">
            Объект восстановления
        </div>

        <div class="object-name" id="object-name">
            Загрузка...
        </div>

    </section>


    <section class="balance-card">

        <div class="balance-label">
            Ресурс экспедиции
        </div>

        <div class="balance" id="balance">
            0
        </div>

    </section>


    <section class="object-zone">

        <div class="object-wrap" id="object-wrap">

            <img
                class="object-img"
                id="object-img"
                src=""
                alt="celestial object"
            >

            <img
                class="cracks-overlay"
                id="cracks-overlay"
                src="/images/cracks.png"
                alt=""
            >

        </div>

    </section>


    <section class="panel">

        <div class="progress-head">
            <span class="progress-title">
                🌌 Восстановление
            </span>

            <span
                class="progress-value"
                id="progress-text"
            >
                0/0
            </span>
        </div>

        <div class="bar">
            <div
                class="bar-fill progress-fill"
                id="progress-fill"
            ></div>
        </div>


        <div class="stamina-section">

            <div class="stamina-head">

                <span class="stamina-title">
                    ⚡ Энергия костюма
                </span>

                <span
                    class="stamina-value"
                    id="stamina-text"
                >
                    0/0
                </span>

            </div>

            <div class="bar">
                <div
                    class="bar-fill stamina-fill"
                    id="stamina-fill"
                ></div>
            </div>

        </div>

    </section>


    <section class="daily">

        <div class="daily-icon">
            🎁
        </div>

        <div class="daily-info">

            <div class="daily-title">
                Ежедневное снабжение
            </div>

            <div
                class="daily-sub"
                id="daily-sub"
            >
                Загрузка...
            </div>

        </div>

        <button
            class="daily-btn"
            id="daily-btn"
        >
            ...
        </button>

    </section>


    <button
        class="prestige-btn"
        id="prestige-btn"
        disabled
    >
        Завершите восстановление объекта
    </button>


    <div class="section-title">
        Модули экспедиции
    </div>


    <section class="upgrades">

        <div class="upgrade-card">

            <div class="upgrade-icon">
                👆
            </div>

            <div class="upgrade-title">
                Усилитель
            </div>

            <div
                class="upgrade-sub"
                id="click-level-text"
            >
                Уровень 1
            </div>

            <button
                class="upgrade-btn"
                id="upgrade-click-btn"
            >
                ...
            </button>

        </div>


        <div class="upgrade-card">

            <div class="upgrade-icon">
                ⚡
            </div>

            <div class="upgrade-title">
                Батарея
            </div>

            <div
                class="upgrade-sub"
                id="stamina-level-text"
            >
                Уровень 1
            </div>

            <button
                class="upgrade-btn"
                id="upgrade-stamina-btn"
            >
                ...
            </button>

        </div>

    </section>


    <div
        class="status"
        id="status"
    >
        Подключение к экспедиционному центру...
    </div>

</div>


<script>

const tg = window.Telegram?.WebApp;

if (tg) {
    tg.ready();
    tg.expand();

    try {
        tg.setHeaderColor("#050711");
        tg.setBackgroundColor("#050711");
    } catch (e) {}
}


const userId =
    tg?.initDataUnsafe?.user?.id || 12345;

const API_URL =
    window.location.origin;


const objectNameEl =
    document.getElementById("object-name");

const balanceEl =
    document.getElementById("balance");

const objectWrapEl =
    document.getElementById("object-wrap");

const objectImgEl =
    document.getElementById("object-img");

const cracksOverlayEl =
    document.getElementById("cracks-overlay");

const statusEl =
    document.getElementById("status");

const progressTextEl =
    document.getElementById("progress-text");

const progressFillEl =
    document.getElementById("progress-fill");

const staminaTextEl =
    document.getElementById("stamina-text");

const staminaFillEl =
    document.getElementById("stamina-fill");

const clickLevelTextEl =
    document.getElementById("click-level-text");

const staminaLevelTextEl =
    document.getElementById("stamina-level-text");

const upgradeClickBtn =
    document.getElementById("upgrade-click-btn");

const upgradeStaminaBtn =
    document.getElementById("upgrade-stamina-btn");

const prestigeBtn =
    document.getElementById("prestige-btn");

const dailySubEl =
    document.getElementById("daily-sub");

const dailyBtn =
    document.getElementById("daily-btn");


let state = null;

let objectsList = [];

let pendingTaps = 0;

let sendTimeout = null;

let localStamina = 0;

let currentObjectIndex = -1;


/* ================= OBJECTS ================= */

async function loadObjectsList() {

    const res =
        await fetch(`${API_URL}/api/objects`);

    if (!res.ok) {
        throw new Error("Objects loading failed");
    }

    objectsList =
        await res.json();
}


/* ================= VISUAL ================= */

function updateObjectVisual() {

    if (!state) return;

    if (
        currentObjectIndex !==
        state.object_index
    ) {

        currentObjectIndex =
            state.object_index;

        const obj =
            objectsList[state.object_index];

        if (obj) {

            objectImgEl.src =
                `/images/${obj.image}`;

        }

        cracksOverlayEl.style.display =
            state.object_category === "planet"
                ? "block"
                : "none";
    }


    let progressPct = 0;

    if (state.object_threshold) {

        progressPct =
            Math.min(
                100,
                (
                    state.object_progress /
                    state.object_threshold
                ) * 100
            );

    } else {

        progressPct = 100;
    }


    if (state.object_category === "planet") {

        cracksOverlayEl.style.opacity =
            1 - (progressPct / 100) * .9;
    }


    if (
        state.object_category === "star" ||
        state.object_category === "blackhole"
    ) {

        const brightness =
            .5 + (progressPct / 100) * .9;

        objectImgEl.style.filter =
            `brightness(${brightness}) drop-shadow(0 0 30px rgba(180,120,255,.22))`;

    } else {

        objectImgEl.style.filter =
            "drop-shadow(0 0 25px rgba(255,180,80,.12))";
    }
}


/* ================= RENDER ================= */

function renderState() {

    if (!state) return;


    objectNameEl.textContent =
        state.object_name;

    balanceEl.textContent =
        Number(state.balance).toLocaleString("ru-RU");


    const staminaPct =
        Math.max(
            0,
            Math.min(
                100,
                (
                    localStamina /
                    state.stamina_max
                ) * 100
            )
        );


    staminaFillEl.style.width =
        `${staminaPct}%`;

    staminaTextEl.textContent =
        `${Math.floor(localStamina)}/${state.stamina_max}`;


    if (state.object_threshold) {

        const progressPct =
            Math.min(
                100,
                (
                    state.object_progress /
                    state.object_threshold
                ) * 100
            );

        progressFillEl.style.width =
            `${progressPct}%`;

        progressTextEl.textContent =
            `${state.object_progress}/${state.object_threshold}`;

    } else {

        progressFillEl.style.width =
            "100%";

        progressTextEl.textContent =
            "ФИНАЛ";
    }


    clickLevelTextEl.textContent =
        `Уровень ${state.click_level} · +${state.click_power} ресурс`;


    if (state.click_upgrade_cost === -1) {

        upgradeClickBtn.textContent =
            "MAX";

        upgradeClickBtn.disabled =
            true;

    } else {

        upgradeClickBtn.textContent =
            `⚡ ${state.click_upgrade_cost}`;

        upgradeClickBtn.disabled =
            state.balance <
            state.click_upgrade_cost;
    }


    staminaLevelTextEl.textContent =
        `Уровень ${state.stamina_level} · ${state.stamina_max} энергии`;


    if (state.stamina_upgrade_cost === -1) {

        upgradeStaminaBtn.textContent =
            "MAX";

        upgradeStaminaBtn.disabled =
            true;

    } else {

        upgradeStaminaBtn.textContent =
            `⚡ ${state.stamina_upgrade_cost}`;

        upgradeStaminaBtn.disabled =
            state.balance <
            state.stamina_upgrade_cost;
    }


    if (state.is_final_object) {

        prestigeBtn.textContent =
            "✦ Квазар — финальный объект";

        prestigeBtn.disabled =
            true;

    } else if (state.can_prestige) {

        prestigeBtn.textContent =
            `🚀 Перейти к следующему объекту · +60%`;

        prestigeBtn.disabled =
            false;

    } else {

        prestigeBtn.textContent =
            "Завершите восстановление объекта";

        prestigeBtn.disabled =
            true;
    }


    const daily =
        state.daily_status;


    dailySubEl.textContent =
        `Серия: ${state.daily_streak} дн. · награда +${state.daily_next_amount}`;


    if (daily.can_claim) {

        dailyBtn.textContent =
            "ЗАБРАТЬ";

        dailyBtn.disabled =
            false;

    } else {

        dailyBtn.textContent =
            `${daily.hours_until_next}ч`;

        dailyBtn.disabled =
            true;
    }


    statusEl.textContent =
        `Экспедиция #${state.prestige_count + 1} · ID ${userId}`;


    updateObjectVisual();
}


/* ================= LOAD ================= */

async function loadState() {

    try {

        const res =
            await fetch(
                `${API_URL}/api/state/${userId}`
            );

        if (!res.ok) {
            throw new Error("State loading failed");
        }

        state =
            await res.json();

        localStamina =
            state.stamina;

        renderState();

    } catch (e) {

        console.error(e);

        statusEl.textContent =
            "Ошибка связи с экспедиционным центром";
    }
}


/* ================= STAMINA ================= */

setInterval(() => {

    if (
        state &&
        localStamina <
        state.stamina_max
    ) {

        localStamina =
            Math.min(
                state.stamina_max,
                localStamina +
                (2 * .2)
            );

        renderState();
    }

}, 200);


/* ================= SYNC ================= */

function scheduleSend() {

    clearTimeout(sendTimeout);


    sendTimeout =
        setTimeout(
            async () => {

                const taps =
                    pendingTaps;

                pendingTaps = 0;


                if (taps <= 0) {
                    return;
                }


                try {

                    const res =
                        await fetch(
                            `${API_URL}/api/click`,
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body: JSON.stringify({
                                    user_id: userId,
                                    taps: taps
                                })
                            }
                        );


                    if (!res.ok) {
                        throw new Error("Click sync failed");
                    }


                    state =
                        await res.json();

                    localStamina =
                        state.stamina;

                    renderState();


                } catch (e) {

                    console.error(e);

                    statusEl.textContent =
                        "Ошибка синхронизации";
                }

            },
            300
        );
}


/* ================= EFFECTS ================= */

function showFloatText(
    x,
    y,
    amount
) {

    const el =
        document.createElement("div");

    el.className =
        "float-text";

    el.textContent =
        `+${amount}`;

    el.style.left =
        `${x}px`;

    el.style.top =
        `${y}px`;

    document.body.appendChild(el);


    setTimeout(
        () => el.remove(),
        800
    );
}


function showClickRing(
    x,
    y
) {

    const ring =
        document.createElement("div");

    ring.className =
        "click-ring";

    ring.style.left =
        `${x}px`;

    ring.style.top =
        `${y}px`;

    document.body.appendChild(ring);


    setTimeout(
        () => ring.remove(),
        600
    );
}


/* ================= CLICK ================= */

objectWrapEl.addEventListener(
    "click",
    (e) => {

        if (
            !state ||
            localStamina < 1
        ) {
            return;
        }


        localStamina -= 1;

        pendingTaps += 1;


        const prestigeMult =
            state.prestige_multiplier || 1;


        const earnedThisClick =
            Math.round(
                state.click_power *
                prestigeMult
            );


        balanceEl.textContent =
            (
                state.balance +
                Math.round(
                    pendingTaps *
                    state.click_power *
                    prestigeMult
                )
            ).toLocaleString("ru-RU");


        showFloatText(
            e.clientX - 10,
            e.clientY - 20,
            earnedThisClick
        );


        showClickRing(
            e.clientX,
            e.clientY
        );


        renderState();

        scheduleSend();


        try {

            tg?.HapticFeedback
                ?.impactOccurred("light");

        } catch (e) {}
    }
);
